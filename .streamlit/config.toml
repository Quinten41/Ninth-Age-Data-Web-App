[theme]
# Base light mode ensures main body & popovers use dark text
base = "light"

# Primary accent color (gold/amber)
primaryColor = "#DEAA46"

# Main app body background (near-white)
backgroundColor = "#f2f2f2"

# Main app widget/popover background (light gray)
secondaryBackgroundColor = "#e5e7eb"

# Dark text for main page and datepicker popovers
textColor = "#1f2937"

font = "DejaVuSans"

# Dedicated sidebar styling
[theme.sidebar]
# Dark blue sidebar background
backgroundColor = "#254C73"

# Dark blue container background for sidebar inputs
secondaryBackgroundColor = "#1b3a5a"

# White text for sidebar labels and controls
textColor = "#ffffff"

[runner]
magicEnabled = false
